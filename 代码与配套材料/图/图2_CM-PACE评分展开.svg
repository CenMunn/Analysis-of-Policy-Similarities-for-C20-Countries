    <text style="font-size: 12px; font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(95.65875 325.886813)">仅 n≥3 且 h≥2 时启用，否则为 0。</text>
